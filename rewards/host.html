<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0d12">
<title>Host Portal — PropChamps</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/blog/blog.css">
<style>
.host-wrap{max-width:860px;margin:0 auto;padding:34px var(--gutter) 90px}
.host-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px;flex-wrap:wrap}
.host-head h1{font-family:var(--font-display);font-weight:900;font-size:32px;letter-spacing:-.03em;color:var(--text-strong)}
.host-head .who{font-family:var(--font-mono);font-size:12px;color:var(--text-faint)}
.host-head .who a{color:var(--lime-text);margin-left:10px}
.sec{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:26px;margin-top:20px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.sec-h h2{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--text-strong)}
.pill{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;border-radius:100px;border:1px solid}
.pill.live{color:var(--lime);border-color:var(--border-lime-strong);background:var(--lime-soft)}
.pill.off{color:var(--text-faint);border-color:var(--border-strong)}
.sec-sub{font-size:13.5px;color:var(--text-soft);margin-bottom:18px;line-height:1.5}
.gv-stats{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.gv-stat .v{font-family:var(--font-display);font-weight:800;font-size:28px;color:var(--text-strong);line-height:1}
.gv-stat .k{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-top:6px}
.gv-stat .v.lime{color:var(--lime)}
.gv-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.gv-controls input{flex:1;min-width:200px;padding:12px 15px;background:var(--bg-band);border:1px solid var(--border-strong);border-radius:11px;color:var(--text);font-size:14px;font-family:var(--font-display)}
.gv-controls input:focus{outline:none;border-color:var(--lime)}
.hb{font-family:var(--font-display);font-weight:700;font-size:14px;padding:12px 20px;border-radius:11px;cursor:pointer;transition:all .15s;border:1px solid;white-space:nowrap}
.hb-open{background:var(--lime);color:var(--bg-base);border-color:var(--lime)}.hb-open:hover{background:var(--lime-2)}
.hb-close{background:var(--bg-elev);color:var(--warning);border-color:rgba(251,191,36,.4)}.hb-close:hover{border-color:var(--warning)}
.hb-reset{background:var(--bg-elev);color:var(--neg);border-color:rgba(248,113,113,.35)}.hb-reset:hover{border-color:var(--neg)}
.hb:disabled{opacity:.4;cursor:not-allowed}
.gv-link{font-family:var(--font-mono);font-size:12.5px;color:var(--text-soft);background:var(--bg-band);border:1px dashed var(--border-strong);border-radius:10px;padding:11px 14px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.gv-link b{color:var(--lime-text)}
.gv-link button{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);border:1px solid var(--border-strong);background:var(--bg-card);border-radius:8px;padding:5px 10px;cursor:pointer}

/* wheel */
.wheel-area{display:flex;flex-direction:column;align-items:center;margin-top:22px}
.wheel-wrap{position:relative;width:min(78vw,360px);height:min(78vw,360px)}
.pointer{position:absolute;top:-5px;left:50%;transform:translateX(-50%);z-index:5;width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:25px solid var(--lime);filter:drop-shadow(0 3px 7px rgba(200,255,0,.6))}
.wheel-ring{position:absolute;inset:0;border-radius:50%;padding:8px;background:conic-gradient(from 0deg,rgba(200,255,0,.5),rgba(200,255,0,.05),rgba(200,255,0,.5),rgba(200,255,0,.05),rgba(200,255,0,.5));box-shadow:0 0 0 1px var(--border-strong),0 24px 60px -20px rgba(0,0,0,.9),0 0 46px -12px rgba(200,255,0,.22)}
.wheel-ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--bg-band)}
#gwheel{position:relative;z-index:1;width:100%;height:100%;transform:rotate(0deg);will-change:transform}
#gwheel svg{display:block;width:100%;height:100%}
.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--bg-elev),var(--bg-band));border:2px solid var(--border-lime-strong);display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px -4px rgba(200,255,0,.4)}
.hub span{font-family:var(--font-display);font-weight:900;font-size:22px;color:var(--lime)}
.spin-btn{margin-top:26px;display:inline-flex;align-items:center;gap:10px;padding:16px 40px;background:var(--lime);color:var(--bg-base);font-family:var(--font-display);font-size:17px;font-weight:800;border:none;border-radius:13px;cursor:pointer;transition:all .15s;box-shadow:0 14px 36px -12px rgba(200,255,0,.6)}
.spin-btn:hover:not(:disabled){background:var(--lime-2);transform:translateY(-2px)}
.spin-btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.wheel-note{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-top:12px;text-align:center}

.winner{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(5,7,10,.6);backdrop-filter:blur(4px)}
.winner.show{display:flex}
.winner-card{background:linear-gradient(180deg,var(--bg-card),var(--bg-band));border:1px solid var(--border-lime-strong);border-radius:24px;padding:44px;text-align:center;box-shadow:0 40px 100px -20px rgba(0,0,0,.9),0 0 80px -20px rgba(200,255,0,.4);transform:scale(.85);animation:pop .5s cubic-bezier(.16,1.3,.4,1) forwards;max-width:440px}
@keyframes pop{to{transform:scale(1)}}
.winner-card .lab{font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--lime-text);margin-bottom:14px}
.winner-card .name{font-family:var(--font-display);font-weight:900;font-size:clamp(30px,7vw,50px);letter-spacing:-.03em;line-height:1.05;color:var(--text-strong);margin-bottom:8px;word-break:break-word}
.winner-card .em{font-family:var(--font-mono);font-size:13px;color:var(--text-soft);margin-bottom:24px}
.winner-card .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.winner-card button{font-family:var(--font-display);font-weight:700;font-size:14px;padding:12px 22px;border-radius:11px;cursor:pointer;border:1px solid}
.wb-close{background:var(--lime);color:var(--bg-base);border-color:var(--lime)}
.wb-again{background:var(--bg-elev);color:var(--text);border-color:var(--border-strong)}
.confetti{position:fixed;top:-12px;z-index:70;width:10px;height:14px;pointer-events:none;border-radius:2px}

/* fulfillment */
.ff-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
.ff-row:last-child{border-bottom:0}
.ff-main{flex:1;min-width:0}
.ff-main .t{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--text-strong)}
.ff-main .d{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);margin-top:3px}
.ff-row button{font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:9px;cursor:pointer;border:1px solid}
.ff-done{background:var(--lime);color:var(--bg-base);border-color:var(--lime)}
.ff-deny{background:var(--bg-elev);color:var(--neg);border-color:rgba(248,113,113,.35)}
.empty{color:var(--text-faint);font-size:14px;padding:22px 0;text-align:center}
.soon{color:var(--text-faint);font-size:13.5px;padding:8px 0}
.gate{max-width:440px;margin:90px auto;text-align:center}
.gate h1{font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--text-strong);margin-bottom:12px}
.gate p{color:var(--text-soft);font-size:15px;line-height:1.6;margin-bottom:22px}
.gate a{display:inline-flex;align-items:center;gap:9px;padding:14px 26px;background:#5865F2;color:#fff;font-weight:700;border-radius:12px}
.gate code{color:var(--lime-text)}
</style>
</head>
<body>
<div class="editorial-strip"><div class="container"><div class="lhs"><span class="dot"></span><span>PropChamps · Host Portal</span></div><div class="rhs" id="whoR"></div></div></div>

<div class="host-wrap" id="wrap"><div class="empty">Loading…</div></div>

<div class="winner" id="winner"><div class="winner-card">
  <div class="lab">🎉 Winner 🎉</div>
  <div class="name" id="winName">—</div>
  <div class="em" id="winEmail"></div>
  <div class="row"><button class="wb-close" onclick="closeWinner()">Done</button><button class="wb-again" onclick="respin()">Spin again</button></div>
</div></div>

<script>
var ME=null, GV=null, ROT=0, spinning=false, winner=null, fallback=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmtDate(s){try{return new Date(s).toLocaleString();}catch(e){return s;}}

async function init(){
  try{ ME=await fetch('/api/me').then(function(r){return r.json();}); }catch(e){ ME={loggedIn:false}; }
  var w=document.getElementById('wrap');
  if(!ME.loggedIn){
    w.innerHTML='<div class="gate"><h1>Host Portal</h1><p>Log in with Discord to access the host controls.</p><a href="/auth/discord">Log in with Discord</a></div>';return;
  }
  document.getElementById('whoR').textContent=ME.user.username;
  if(!ME.user.isHost){
    w.innerHTML='<div class="gate"><h1>Not authorized</h1><p>This portal is for the show host. Your Discord ID is <code>'+esc(ME.user.discordId)+'</code> — add it to HOST_DISCORD_IDS for access.</p></div>';return;
  }
  render();
  loadGiveaway();
  loadFulfillment();
}

function render(){
  document.getElementById('wrap').innerHTML=
   '<div class="host-head"><h1>Host Portal</h1><div class="who">'+esc(ME.user.username)+'<a href="/auth/logout">Log out</a></div></div>'
   +'<div class="sec" id="gvSec"><div class="empty">Loading giveaway…</div></div>'
   +'<div class="sec"><div class="sec-h"><h2>🎟️ Monthly raffle</h2><span class="pill off">wiring next</span></div><div class="soon">The $500 monthly raffle wheel + draw-date + auto-reset lands in the next update. It uses this same wheel, fed by point-redemption entries (tier-weighted).</div></div>'
   +'<div class="sec" id="ffSec"><div class="empty">Loading fulfillment…</div></div>';
}

/* ---------- LIVE GIVEAWAY ---------- */
async function loadGiveaway(){
  try{ GV=await fetch('/api/host/giveaway').then(function(r){return r.json();}); }catch(e){ GV={entries:[],count:0,open:false}; }
  var s=document.getElementById('gvSec');
  var origin=location.origin;
  s.innerHTML=
    '<div class="sec-h"><h2>📣 Live giveaway</h2><span class="pill '+(GV.open?'live':'off')+'">'+(GV.open?'● Live · accepting entries':'Closed')+'</span></div>'
    +'<div class="sec-sub">Drop the link on stream, watch entries roll in, then spin for a winner. Reset clears the pot but keeps every email.</div>'
    +'<div class="gv-stats"><div class="gv-stat"><div class="v lime">'+(GV.count||0).toLocaleString()+'</div><div class="k">In this giveaway</div></div>'
      +'<div class="gv-stat"><div class="v">'+(GV.totalEmails||0).toLocaleString()+'</div><div class="k">Total emails collected</div></div></div>'
    +'<div class="gv-controls"><input id="gvTitle" placeholder="Giveaway title (e.g. Win a 50K Account)" value="'+esc(GV.title||'')+'">'
      +(GV.open
        ? '<button class="hb hb-close" onclick="gvAction(\'close\')">Close entries</button>'
        : '<button class="hb hb-open" onclick="gvAction(\'open\')">Open giveaway</button>')
      +'<button class="hb hb-reset" onclick="gvReset()">Reset</button></div>'
    +'<div class="gv-link"><span>Share on stream: <b>'+esc(origin.replace(/^https?:\/\//,''))+'/win</b></span><button onclick="copyLink()">Copy link</button></div>'
    +'<div class="wheel-area"><div class="wheel-wrap"><div class="pointer"></div><div class="wheel-ring"></div><div id="gwheel"></div><div class="hub"><span>P</span></div></div>'
      +'<button class="spin-btn" id="spinBtn" onclick="spin()"'+((GV.count||0)<1?' disabled':'')+'>🎯 SPIN FOR A WINNER</button>'
      +'<div class="wheel-note" id="wheelNote"></div></div>';
  buildWheel();
}
function copyLink(){var t=location.origin+'/win';navigator.clipboard&&navigator.clipboard.writeText(t);var b=event.target;var o=b.textContent;b.textContent='Copied!';setTimeout(function(){b.textContent=o;},1400);}
async function gvAction(action){
  var title=document.getElementById('gvTitle')?document.getElementById('gvTitle').value:'';
  await fetch('/api/host/giveaway/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:action,title:title})}).catch(function(){});
  loadGiveaway();
}
async function gvReset(){
  if(!confirm('Clear all entries for this giveaway? (Emails are kept in your list.)'))return;
  await fetch('/api/host/giveaway/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'reset'})}).catch(function(){});
  loadGiveaway();
}

/* entrant labels for the wheel */
function gvLabels(){
  return (GV.entries||[]).map(function(e){ return { label: (e.name&&e.name.trim())? e.name.trim() : String(e.email||'').split('@')[0], email: e.email }; });
}
var DISPLAY=[]; // the subset shown on the wheel
function buildWheel(){
  var all=gvLabels();
  var note=document.getElementById('wheelNote');
  if(!all.length){ document.getElementById('gwheel').innerHTML=''; if(note)note.textContent='No entries yet — open the giveaway and share the link.'; return; }
  // show up to 20 slices; if more, we display a sample and inject the winner at spin time
  DISPLAY = all.length<=20 ? all.slice() : shuffle(all.slice()).slice(0,20);
  drawWheel(DISPLAY);
  if(note)note.textContent = all.length>20 ? ('Showing 20 of '+all.length.toLocaleString()+' entrants — winner is drawn from all of them.') : (all.length+' entrant'+(all.length===1?'':'s')+' on the wheel.');
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function drawWheel(items){
  var N=items.length, seg=360/N, r=180, cx=180, cy=180, C=['#141b26','#0e141c'];
  var s='<svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">';
  for(var i=0;i<N;i++){
    var a0=(i*seg-90)*Math.PI/180, a1=((i+1)*seg-90)*Math.PI/180;
    var x0=(cx+r*Math.cos(a0)).toFixed(2),y0=(cy+r*Math.sin(a0)).toFixed(2),x1=(cx+r*Math.cos(a1)).toFixed(2),y1=(cy+r*Math.sin(a1)).toFixed(2);
    var large=seg>180?1:0;
    s+='<path d="M'+cx+','+cy+' L'+x0+','+y0+' A'+r+','+r+' 0 '+large+' 1 '+x1+','+y1+' Z" fill="'+C[i%2]+'" stroke="rgba(200,255,0,.16)" stroke-width="1.4"/>';
    var mid=(i+0.5)*seg, phi=(mid-90)*Math.PI/180, lr=r*0.64;
    var lx=(cx+lr*Math.cos(phi)),ly=(cy+lr*Math.sin(phi));
    var rot=mid-90; if(rot>90&&rot<270)rot+=180;
    var nm=items[i].label; if(nm.length>12)nm=nm.slice(0,11)+'…';
    s+='<text x="'+lx.toFixed(2)+'" y="'+ly.toFixed(2)+'" fill="#e8edf2" font-size="'+(N>14?11:13)+'" font-weight="700" text-anchor="middle" dominant-baseline="middle" font-family="Inter,sans-serif" transform="rotate('+rot.toFixed(2)+' '+lx.toFixed(2)+' '+ly.toFixed(2)+')">'+esc(nm)+'</text>';
  }
  s+='</svg>';
  document.getElementById('gwheel').innerHTML=s;
}
function spin(){
  var all=gvLabels(); if(spinning||!all.length)return;
  spinning=true; var btn=document.getElementById('spinBtn'); if(btn)btn.disabled=true;
  // pick the real winner from ALL entrants (uniform)
  winner=all[Math.floor(Math.random()*all.length)];
  // ensure the winner is on the displayed wheel
  var idx=DISPLAY.findIndex(function(d){return d.email===winner.email;});
  if(idx<0){ DISPLAY[Math.floor(Math.random()*DISPLAY.length)]=winner; drawWheel(DISPLAY); idx=DISPLAY.findIndex(function(d){return d.email===winner.email;}); }
  var N=DISPLAY.length, seg=360/N;
  var targetMod=((360-((idx+0.5)*seg))%360+360)%360, jitter=(Math.random()-0.5)*seg*0.6;
  var base=ROT-(ROT%360), newRot=base+6*360+targetMod+jitter; if(newRot<=ROT+720)newRot+=360; ROT=newRot;
  var wh=document.getElementById('gwheel');
  wh.style.transition='transform 5.6s cubic-bezier(.12,.62,.11,1)'; wh.style.transform='rotate('+newRot+'deg)';
  clearTimeout(fallback); fallback=setTimeout(finishSpin,5900);
  wh.addEventListener('transitionend',finishSpin,{once:true});
}
function finishSpin(){
  if(!spinning)return; clearTimeout(fallback); spinning=false;
  var btn=document.getElementById('spinBtn'); if(btn)btn.disabled=false;
  document.getElementById('winName').textContent=winner.label;
  document.getElementById('winEmail').textContent=winner.email||'';
  document.getElementById('winner').classList.add('show'); burst();
}
function closeWinner(){document.getElementById('winner').classList.remove('show');}
function respin(){closeWinner();setTimeout(spin,350);}
function burst(){
  var colors=['#c8ff00','#d4ff33','#ffffff','#a3d600','#e8edf2'];
  for(var i=0;i<80;i++){(function(){var c=document.createElement('div');c.className='confetti';c.style.left=(Math.random()*100)+'vw';c.style.background=colors[i%colors.length];c.style.width=(6+Math.random()*7)+'px';c.style.height=(9+Math.random()*8)+'px';document.body.appendChild(c);var fall=1400+Math.random()*1300,rot=(Math.random()*720-360);c.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:'translateY(105vh) rotate('+rot+'deg)',opacity:.9}],{duration:fall,easing:'cubic-bezier(.2,.6,.4,1)',delay:Math.random()*250});setTimeout(function(){c.remove();},fall+400);})();}
}

/* ---------- FULFILLMENT ---------- */
async function loadFulfillment(){
  var data; try{ data=await fetch('/api/host/fulfillment').then(function(r){return r.json();}); }catch(e){ data={pending:[]}; }
  var p=data.pending||[], s=document.getElementById('ffSec');
  var head='<div class="sec-h"><h2>💸 Fulfillment</h2><span class="pill '+(p.length?'live':'off')+'">'+p.length+' to fulfill</span></div><div class="sec-sub">People who redeemed a reward you deliver by hand (cash, free account, merch). Mark them done once you’ve sent it.</div>';
  if(!p.length){ s.innerHTML=head+'<div class="empty">Nothing to fulfill right now.</div>'; return; }
  s.innerHTML=head+p.map(function(r){
    return '<div class="ff-row" id="ff-'+r.id+'"><div class="ff-main"><div class="t">'+esc(r.reward_name)+' · '+r.cost_points+' pts</div>'
      +'<div class="d">'+esc(r.username)+' · Discord '+esc(r.discord_id)+' · '+esc(fmtDate(r.created_at))+'</div></div>'
      +'<button class="ff-done" onclick="ffMark(\''+r.id+'\',\'fulfilled\')">✓ Fulfilled</button>'
      +'<button class="ff-deny" onclick="ffMark(\''+r.id+'\',\'denied\')">✕</button></div>';
  }).join('');
}
async function ffMark(id,status){
  var row=document.getElementById('ff-'+id); if(row)row.style.opacity='.4';
  await fetch('/api/host/fulfillment/mark',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:id,status:status})}).catch(function(){});
  loadFulfillment();
}
init();
</script>
</body>
</html>
