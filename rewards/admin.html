<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0d12">
<title>Rewards Admin — PropChamps</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/blog/blog.css">
<style>
.admin-wrap{max-width:900px;margin:0 auto;padding:40px var(--gutter) 80px}
.admin-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:8px;flex-wrap:wrap}
.admin-head h1{font-family:var(--font-display);font-weight:800;font-size:30px;letter-spacing:-.03em;color:var(--text-strong)}
.admin-head .cnt{font-family:var(--font-mono);font-size:13px;color:var(--lime-text)}
.admin-sub{color:var(--text-soft);font-size:15px;margin-bottom:30px}
.q-card{display:grid;grid-template-columns:200px 1fr;gap:20px;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
.q-img{width:200px;height:150px;border-radius:10px;object-fit:cover;background:var(--bg-band);border:1px solid var(--border-strong);cursor:zoom-in}
.q-body{display:flex;flex-direction:column;min-width:0}
.q-firm{font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--text-strong);letter-spacing:-.02em}
.q-amt{font-size:14px;color:var(--text-soft);margin-top:4px}
.q-meta{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);margin-top:8px;line-height:1.6}
.q-actions{margin-top:auto;display:flex;gap:10px;padding-top:14px}
.q-actions button{padding:11px 22px;font-size:14px;font-weight:700;border-radius:10px;transition:all .15s}
.b-app{background:var(--lime);color:var(--bg-base)}.b-app:hover{background:var(--lime-2)}
.b-rej{background:var(--bg-elev);color:var(--neg);border:1px solid rgba(248,113,113,.35)}.b-rej:hover{border-color:var(--neg)}
.q-actions button:disabled{opacity:.4;cursor:not-allowed}
.q-actions.pay{flex-wrap:wrap;align-items:center}
.kind-badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:100px;margin-bottom:8px;border:1px solid}
.kind-badge.pay{color:#5eead4;border-color:rgba(94,234,212,.4);background:rgba(94,234,212,.08)}
.pts-row{display:flex;flex-direction:column;gap:5px;margin-right:auto}
.pts-lbl{font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint)}
.pts-in{width:130px;padding:9px 12px;background:var(--bg-base);border:1px solid var(--border-strong);border-radius:9px;color:var(--text-strong);font-size:15px;font-weight:700;font-family:var(--font-mono)}
.pts-in:focus{outline:none;border-color:var(--lime)}
.state{text-align:center;padding:60px 20px;color:var(--text-soft)}
.state .big{font-size:40px;margin-bottom:14px}
.gate{max-width:440px;margin:80px auto;text-align:center}
.gate h1{font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--text-strong);margin-bottom:12px}
.gate p{color:var(--text-soft);font-size:15px;line-height:1.6;margin-bottom:22px}
.gate a{display:inline-flex;align-items:center;gap:9px;padding:14px 26px;background:#5865F2;color:#fff;font-weight:700;border-radius:12px}
.lightbox{position:fixed;inset:0;background:rgba(5,7,10,.9);display:none;align-items:center;justify-content:center;z-index:100;padding:30px;cursor:zoom-out}
.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:100%;border-radius:12px}
.ai-box{margin:8px 0 12px;padding:12px 14px;border-radius:11px;border:1px solid var(--border);background:var(--bg-band)}
.ai-badge{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:100px;border:1px solid}
.ai-approve{color:var(--positive);border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08)}
.ai-review{color:var(--warning);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.ai-reject{color:var(--neg);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08)}
.ai-none{color:var(--text-faint);border-color:var(--border-strong)}
.ai-conf{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-left:8px}
.ai-sum{font-size:13px;color:var(--text-soft);margin-top:8px;line-height:1.5}
.ai-fields{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-family:var(--font-mono);font-size:11px;color:var(--text-faint)}
.ai-fields b{color:var(--text);font-weight:600}
.ai-flags{margin:8px 0 0 16px;font-size:12px;color:var(--warning)}
/* ---- per-person folders ---- */
.folder{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;margin-bottom:14px;overflow:hidden}
.folder.dup{border-color:rgba(248,113,113,.5)}
.folder-head{display:flex;align-items:center;gap:14px;padding:15px 18px;cursor:pointer;user-select:none}
.folder-head:hover{background:rgba(255,255,255,.025)}
.fh-av{width:44px;height:44px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,#2a3441,#151b24);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;color:var(--text-strong);font-size:15px;border:1px solid var(--border-strong);overflow:hidden}
.fh-av img{width:100%;height:100%;object-fit:cover}
.fh-main{flex:1;min-width:0}
.fh-name{font-family:var(--font-display);font-weight:800;font-size:17px;color:var(--text-strong);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fh-sub{font-family:var(--font-mono);font-size:11.5px;color:var(--text-faint);margin-top:3px}
.fh-chevron{font-size:13px;color:var(--text-faint);transition:transform .2s;flex-shrink:0}
.folder.open .fh-chevron{transform:rotate(180deg)}
.folder-body{display:none;padding:2px 14px 14px;flex-direction:column;gap:12px}
.folder.open .folder-body{display:flex}
.folder-body .q-card{margin-bottom:0;background:var(--bg-band)}
.dup-badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:100px;border:1px solid;margin-bottom:8px;line-height:1.3}
.dup-badge.duplicate{color:var(--neg);border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.1)}
.dup-badge.similar{color:var(--warning);border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.09)}
.fh-flag{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:4px 10px;border-radius:100px;border:1px solid rgba(248,113,113,.5);color:var(--neg);background:rgba(248,113,113,.1);white-space:nowrap;flex-shrink:0}
.reason-box{margin-top:12px}
.reason-box label{display:block;font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px}
.reason-in{width:100%;min-height:62px;resize:vertical;padding:10px 12px;background:var(--bg-base);border:1px solid var(--border-strong);border-radius:10px;color:var(--text);font-size:13px;font-family:inherit;line-height:1.5}
.reason-in:focus{outline:none;border-color:var(--neg)}
.reason-hint{font-size:11px;color:var(--text-faint);margin-top:5px}
.prior-badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:100px;border:1px solid rgba(248,113,113,.4);color:var(--neg);background:rgba(248,113,113,.08);margin-bottom:8px;line-height:1.3}
/* ---- past-submission history ---- */
.hist-block{margin-top:4px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--bg-base)}
.hist-head{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;user-select:none}
.hist-head:hover{background:rgba(255,255,255,.02)}
.hist-t{font-family:var(--font-display);font-weight:700;font-size:13.5px;color:var(--text)}
.hist-meta{font-family:var(--font-mono);font-size:11px;color:var(--text-faint);margin-left:auto}
.hist-chevron{font-size:12px;color:var(--text-faint);transition:transform .2s}
.hist-block.open .hist-chevron{transform:rotate(180deg)}
.hist-list{display:none;flex-direction:column;gap:8px;padding:0 12px 12px}
.hist-block.open .hist-list{display:flex}
.hist-item{display:flex;align-items:center;gap:12px;padding:8px;background:var(--bg-card);border:1px solid var(--border);border-radius:10px}
.hist-img{width:64px;height:48px;border-radius:7px;object-fit:cover;background:var(--bg-band);border:1px solid var(--border-strong);cursor:zoom-in;flex-shrink:0}
.hist-info{flex:1;min-width:0}
.hist-firm{font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--text-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-amt{font-size:12px;color:var(--text-soft);margin-top:2px}
.hist-date{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);margin-top:3px}
.hist-status{font-family:var(--font-mono);font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:100px;border:1px solid;white-space:nowrap;flex-shrink:0}
.hist-status.approved{color:var(--positive);border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08)}
.hist-status.rejected{color:var(--neg);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08)}
/* ---- AI image comparison ---- */
.ai-check-bar{margin-bottom:4px}
.ai-check-btn{font-family:var(--font-display);font-weight:700;font-size:12.5px;padding:9px 15px;border-radius:10px;cursor:pointer;background:var(--bg-elev);color:var(--lime-text);border:1px solid var(--border-lime);transition:all .15s}
.ai-check-btn:hover:not(:disabled){border-color:var(--lime);color:var(--lime)}
.ai-check-btn:disabled{opacity:.6;cursor:progress}
.ai-check-result{margin-top:10px}
.ai-check-msg{font-size:13px;line-height:1.5;padding:10px 12px;border-radius:10px;border:1px solid}
.ai-check-msg.ok{color:var(--positive);border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.07)}
.ai-check-msg.warn{color:var(--neg);border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.1);font-weight:600}
.ai-check-msg.err{color:var(--warning);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.ai-group{margin-top:8px;padding:10px 12px;border:1px solid rgba(248,113,113,.35);border-radius:10px;background:rgba(248,113,113,.05)}
.ai-group-top{font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--neg);margin-bottom:6px;line-height:1.4}
.ai-group ul{margin:0;padding-left:18px}
.ai-group li{font-size:12.5px;color:var(--text);margin:3px 0}
.ai-mem-status{font-family:var(--font-mono);font-size:10px;font-weight:700;padding:2px 7px;border-radius:100px;border:1px solid var(--border-strong);color:var(--text-faint);margin-left:4px}
.ai-mem-status.rejected{color:var(--neg);border-color:rgba(248,113,113,.4)}
.ai-mem-status.approved{color:var(--positive);border-color:rgba(74,222,128,.4)}
.ai-mem-status.pending{color:var(--lime-text);border-color:var(--border-lime)}
.q-card.ai-match{border-color:var(--neg)!important;box-shadow:0 0 0 1px rgba(248,113,113,.4)}
@media(max-width:640px){.q-card{grid-template-columns:1fr}.q-img{width:100%;height:180px}}
</style>
</head>
<body>
<div class="editorial-strip"><div class="container"><div class="lhs"><span class="dot"></span><span>PropChamps Rewards · Admin</span></div><div class="rhs" id="who"></div></div></div>

<div class="admin-wrap" id="wrap">
  <div class="state"><div class="big">⏳</div>Loading…</div>
</div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('open')"><img id="lbImg" src="" alt="receipt"></div>

<script>
var ME=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmtDate(s){try{return new Date(s).toLocaleString();}catch(e){return s;}}
function renderAI(s){
  var v=null; try{ v=s.ai_notes?JSON.parse(s.ai_notes):null; }catch(e){}
  if(!v){return '<div class="ai-box"><span class="ai-badge ai-none">AI · not scored</span></div>';}
  if(v.error){return '<div class="ai-box"><span class="ai-badge ai-reject">AI error · '+esc(v.error)+'</span>'+(v.detail?'<div class="ai-sum">'+esc(v.detail)+'</div>':'')+'</div>';}
  var rec=v.recommendation||'review';
  var cls=rec==='approve'?'ai-approve':rec==='reject'?'ai-reject':'ai-review';
  var label=rec==='approve'?'✓ AI: likely legit':rec==='reject'?'✕ AI: probably junk':'⚠ AI: needs a look';
  var conf=(typeof v.confidence==='number')?Math.round(v.confidence*100)+'% confidence':'';
  var flags=(v.redFlags&&v.redFlags.length)?'<ul class="ai-flags">'+v.redFlags.map(function(f){return '<li>'+esc(f)+'</li>';}).join('')+'</ul>':'';
  return '<div class="ai-box">'
    +'<span class="ai-badge '+cls+'">'+label+'</span><span class="ai-conf">'+conf+'</span>'
    +(v.summary?'<div class="ai-sum">'+esc(v.summary)+'</div>':'')
    +'<div class="ai-fields"><span>CHAMP code: <b>'+(v.champCodeVisible?'✓ visible':'✗ not seen')+'</b></span>'
    +(v.firmDetected?'<span>read firm: <b>'+esc(v.firmDetected)+'</b></span>':'')
    +(v.amountDetected?'<span>read amount: <b>'+esc(v.amountDetected)+'</b></span>':'')
    +'</div>'+flags
    +'</div>';
}

async function init(){
  var me=await fetch('/api/me').then(function(r){return r.json();}).catch(function(){return{loggedIn:false};});
  ME=me;
  var w=document.getElementById('wrap');
  if(!me.loggedIn){
    w.innerHTML='<div class="gate"><h1>Rewards Admin</h1><p>Log in with the Discord account that owns this rewards program.</p><a href="/auth/discord"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.211.375-.445.865-.608 1.249a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.036A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.891.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.331c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.211 0 2.176 1.096 2.157 2.42 0 1.332-.955 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.211 0 2.176 1.096 2.157 2.42 0 1.332-.946 2.418-2.157 2.418z"/></svg> Log in with Discord</a></div>';
    return;
  }
  document.getElementById('who').textContent=me.user.username;
  if(!me.user.isAdmin){
    w.innerHTML='<div class="gate"><h1>Not authorized</h1><p>Your Discord account ('+esc(me.user.username)+') isn’t on the admin list. Your Discord ID is <code style="color:var(--lime-text)">'+esc(me.user.discordId)+'</code> — add it to ADMIN_DISCORD_IDS to get access.</p></div>';
    return;
  }
  loadQueue();
}

function initials(n){return String(n||'?').replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase()||'?';}
function aiRedFlagsText(s){
  try{ var v=JSON.parse(s.ai_notes||'{}'); var f=Array.isArray(v.redFlags)?v.redFlags:[]; return f.map(function(x){return String(x||'').trim();}).filter(Boolean).join('\n'); }catch(e){ return ''; }
}
function countLabel(pending,people){ return pending+' pending · '+people+' '+(people===1?'person':'people'); }

async function loadQueue(){
  var w=document.getElementById('wrap');
  var data=await fetch('/api/admin/queue').then(function(r){return r.json();}).catch(function(){return{groups:[],count:0};});
  var groups=data.groups||[]; var count=data.count||0;
  var head='<div class="admin-head"><h1>Review queue</h1><span class="cnt">'+countLabel(count,groups.length)+'</span></div>'
    +'<p class="admin-sub">Grouped by person — click a name to open their submissions and their past ones. Purchases: confirm code CHAMP → approve (+250). Payouts: confirm the amount → award 1 pt/$1. Rejecting emails them the reason (pre-filled from the AI — edit it first). A <span style="color:var(--neg);font-weight:600">red flag</span> means a possible repeat of something they already submitted, approved, or had rejected.</p>';
  if(!count){ w.innerHTML=head+'<div class="state"><div class="big">✅</div>All caught up — nothing pending.</div>'; return; }
  var single=groups.length===1;
  w.innerHTML=head+groups.map(function(g){return renderFolder(g, single||g.hasHistoryMatch||g.hasDuplicates);}).join('');
}
function renderFolder(g, open){
  var n=g.submissions.length;
  var avImg=g.avatar?'<img src="https://cdn.discordapp.com/avatars/'+esc(g.discord_id)+'/'+esc(g.avatar)+'.png?size=64" alt="" onerror="this.style.display=\'none\';this.parentNode.textContent=\''+initials(g.username)+'\'">':initials(g.username);
  var flag=g.hasHistoryMatch?'<span class="fh-flag">⚠ repeat of a past one</span>':(g.hasDuplicates?'<span class="fh-flag">⚠ possible repeat</span>':'');
  var past=((g.approvedCount||0)+(g.rejectedCount||0));
  var sub=n+' pending'+(past?(' · '+(g.approvedCount||0)+' approved · '+(g.rejectedCount||0)+' rejected before'):'')+' · Discord '+esc(g.discord_id);
  return '<div class="folder'+((g.hasDuplicates||g.hasHistoryMatch)?' dup':'')+(open?' open':'')+'" id="folder-'+esc(g.user_id)+'">'
    +'<div class="folder-head" onclick="toggleFolder(\''+esc(g.user_id)+'\')">'
    +'<div class="fh-av">'+avImg+'</div>'
    +'<div class="fh-main"><div class="fh-name">'+esc(g.username)+'</div><div class="fh-sub">'+sub+'</div></div>'
    +flag+'<div class="fh-chevron">▾</div></div>'
    +'<div class="folder-body">'+aiBar(g)+g.submissions.map(renderSub).join('')+renderHistory(g)+'</div>'
    +'</div>';
}
function aiBar(g){
  var total=g.submissions.length+((g.history&&g.history.length)||0);
  if(total<2)return ''; // nothing to compare against
  return '<div class="ai-check-bar"><button class="ai-check-btn" id="aibtn-'+esc(g.user_id)+'" onclick="aiCheck(\''+esc(g.user_id)+'\',this)">🔍 AI-check these images for repeats</button>'
    +'<div class="ai-check-result" id="aires-'+esc(g.user_id)+'"></div></div>';
}
async function aiCheck(userId,btn){
  var box=document.getElementById('aires-'+userId); if(box)box.innerHTML='';
  btn.disabled=true; var old=btn.textContent; btn.textContent='🔍 Comparing images…';
  var res;
  try{ res=await fetch('/api/admin/compare',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({userId:userId})}).then(function(r){return r.json();}); }
  catch(e){ res={error:'network'}; }
  btn.disabled=false; btn.textContent=old;
  var folder=document.getElementById('folder-'+userId);
  if(folder)[].slice.call(folder.querySelectorAll('.q-card.ai-match')).forEach(function(c){c.classList.remove('ai-match');});
  if(!box)return;
  if(!res||!res.ok){ box.innerHTML='<div class="ai-check-msg err">AI check couldn’t run'+(res&&res.error?' ('+esc(res.error)+')':'')+' — try again.</div>'; return; }
  if(!res.groups||!res.groups.length){ box.innerHTML='<div class="ai-check-msg ok">🤖 Compared '+(res.checked||0)+' image'+((res.checked||0)===1?'':'s')+' — no same-source repeats found.'+(res.summary?' '+esc(res.summary):'')+'</div>'; return; }
  var html='<div class="ai-check-msg warn">🤖 The AI found '+res.groups.length+' set'+(res.groups.length>1?'s':'')+' that look like the SAME receipt (name/amount possibly swapped):</div>';
  res.groups.forEach(function(gp){
    html+='<div class="ai-group"><div class="ai-group-top">Same source'+(typeof gp.confidence==='number'?(' · '+Math.round(gp.confidence*100)+'% sure'):'')+(gp.reason?(' — '+esc(gp.reason)):'')+'</div><ul>';
    (gp.members||[]).forEach(function(mem){
      html+='<li>'+esc(mem.firm||'?')+' · '+esc(mem.amount||'—')+(mem.kind==='payout'?' (payout)':'')+' <span class="ai-mem-status '+esc(mem.status)+'">'+esc(mem.status)+'</span></li>';
      var card=document.getElementById('card-'+mem.id); if(card)card.classList.add('ai-match');
    });
    html+='</ul></div>';
  });
  box.innerHTML=html;
}
function renderHistory(g){
  if(!g.history||!g.history.length)return '';
  return '<div class="hist-block" id="hist-'+esc(g.user_id)+'">'
    +'<div class="hist-head" onclick="toggleHist(\''+esc(g.user_id)+'\')"><span class="hist-t">🗂 Past submissions</span>'
    +'<span class="hist-meta">'+(g.approvedCount||0)+' approved · '+(g.rejectedCount||0)+' rejected</span><span class="hist-chevron">▾</span></div>'
    +'<div class="hist-list">'+g.history.map(renderHistItem).join('')+'</div></div>';
}
function renderHistItem(h){
  var pay=h.kind==='payout';
  var pts=(h.status==='approved'&&h.points_awarded)?(' · +'+Number(h.points_awarded).toLocaleString()+' pts'):'';
  return '<div class="hist-item">'
    +'<img class="hist-img" loading="lazy" src="/api/admin/image/'+h.id+'" alt="" onclick="zoom(this.src)" onerror="this.style.opacity=.25">'
    +'<div class="hist-info"><div class="hist-firm">'+esc(h.firm_slug)+(pay?' · payout':'')+'</div>'
    +'<div class="hist-amt">'+esc(h.claimed_amount||'—')+pts+'</div>'
    +'<div class="hist-date">'+esc(fmtDate(h.reviewed_at||h.created_at))+'</div></div>'
    +'<span class="hist-status '+esc(h.status)+'">'+(h.status==='approved'?'✓ approved':'✕ rejected')+'</span></div>';
}
function toggleHist(id){var f=document.getElementById('hist-'+id);if(f)f.classList.toggle('open');}
function renderSub(s){
  var pay=s.kind==='payout';
  var guess=pay?parsePayout(s.claimed_amount):0;
  var histMatch=s.dup&&(s.dup.against==='approved'||s.dup.against==='rejected');
  var badgeCls=histMatch?'duplicate':(s.dup?s.dup.level:'');
  var dupBadge=s.dup?('<div class="dup-badge '+badgeCls+'">'+((s.dup.level==='duplicate'||histMatch)?'🚫 ':'⚠ ')+esc(s.dup.note)+'</div>'):'';
  var priorBadge=s.priorRejects?('<div class="prior-badge">⚠ '+s.priorRejects+' earlier '+esc(s.firm_slug)+' '+(pay?'payout':'submission')+(s.priorRejects>1?'s':'')+' from this person were rejected</div>'):'';
  dupBadge=dupBadge+priorBadge;
  var reasonBox='<div class="reason-box"><label>Rejection note — emailed if you reject</label>'
    +'<textarea class="reason-in" id="reason-'+s.id+'" placeholder="Why is this being rejected? (blank = send the default note)">'+esc(aiRedFlagsText(s))+'</textarea>'
    +'<div class="reason-hint">Pre-filled from the AI. Edit or clear before you reject.</div></div>';
  var actions=pay
    ? '<div class="q-actions pay"><div class="pts-row"><span class="pts-lbl">Points to award</span><input class="pts-in" id="pts-'+s.id+'" type="number" min="1" step="1" value="'+(guess||'')+'" placeholder="e.g. 2200"></div>'
      +'<button class="b-app" onclick="review(\''+s.id+'\',\'approve\',this)">✓ Approve payout</button>'
      +'<button class="b-rej" onclick="review(\''+s.id+'\',\'reject\',this)">✕ Reject</button></div>'
    : '<div class="q-actions"><button class="b-app" onclick="review(\''+s.id+'\',\'approve\',this)">✓ Approve (+250)</button>'
      +'<button class="b-rej" onclick="review(\''+s.id+'\',\'reject\',this)">✕ Reject</button></div>';
  return '<div class="q-card" id="card-'+s.id+'">'
    +'<img class="q-img" src="/api/admin/image/'+s.id+'" alt="receipt" onclick="zoom(this.src)" onerror="this.style.opacity=.3">'
    +'<div class="q-body">'
    +(pay?'<div class="kind-badge pay">💸 Payout · 1 pt / $1</div>':'')
    +dupBadge
    +'<div class="q-firm">'+esc(s.firm_slug)+'</div>'
    +'<div class="q-amt">'+(pay?'Claimed payout: ':'')+esc(s.claimed_amount||'—')+'</div>'
    +'<div class="q-meta">submitted '+esc(fmtDate(s.created_at))+'</div>'
    +(pay?'':renderAI(s))
    +reasonBox
    +actions
    +'</div></div>';
}
function toggleFolder(id){var f=document.getElementById('folder-'+id);if(f)f.classList.toggle('open');}
function parsePayout(str){
  if(!str)return 0;
  var m=String(str).replace(/,/g,'').match(/\d+(\.\d+)?/);
  return m?Math.round(parseFloat(m[0])):0;
}

async function review(id,action,btn){
  var card=document.getElementById('card-'+id);
  var payload={submissionId:id,action:action};
  if(action==='approve'){
    var inp=document.getElementById('pts-'+id);
    if(inp){ // payout — award the entered amount (1 pt / $1)
      var p=Math.floor(Number(inp.value));
      if(!p||p<1){alert('Enter the payout points (1 per $1) before approving.');return;}
      if(p>500000){alert('That exceeds the max of 500,000 points — double-check the amount.');return;}
      if(!confirm('Award '+p.toLocaleString()+' points for this payout?'))return;
      payload.points=p;
    }
  } else if(action==='reject'){
    var r=document.getElementById('reason-'+id);
    if(r)payload.reason=r.value;
    if(!confirm('Reject this submission? They’ll be emailed the reason'+((r&&r.value.trim())?'.':' (default note).')))return;
  }
  card.querySelectorAll('button').forEach(function(b){b.disabled=true;});
  var res=await fetch('/api/admin/review',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)}).then(function(r){return r.json();}).catch(function(){return{error:'network'};});
  if(res.ok){
    var folder=card.closest('.folder');
    card.style.transition='opacity .3s';card.style.opacity='0';
    setTimeout(function(){
      card.remove();
      if(folder&&!folder.querySelector('.q-card'))folder.remove();
      var cnt=document.querySelector('.admin-head .cnt');
      if(cnt){var m=cnt.textContent.match(/^(\d+)/);var n=Math.max(0,(m?parseInt(m[1],10):1)-1);cnt.textContent=countLabel(n,document.querySelectorAll('.folder').length);}
      if(!document.querySelector('.folder'))loadQueue();
    },320);
  } else { alert('Error: '+(res.error||'failed')); card.querySelectorAll('button').forEach(function(b){b.disabled=false;}); }
}
function zoom(src){document.getElementById('lbImg').src=src;document.getElementById('lightbox').classList.add('open');}
init();
</script>
